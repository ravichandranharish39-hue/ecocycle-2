  --bg: #070d09;

  --stat-glow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
html[data-theme="dark"] {
  color-scheme: dark;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  background-image: var(--bg-pattern);
  background-attachment: fixed;
  color: var(--tx);
  min-height: 100vh;
  transition: background-color 0.25s ease, color 0.25s ease;
}

/* Card base */
.c {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 1.25rem;
  padding: 1.25rem;
  box-shadow: var(--stat-glow);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.c:hover {
  border-color: var(--bd-hover);
}
.c-interactive:hover {
  transform: translateY(-2px);
  border-color: rgba(16, 185, 129, 0.45);
}
.c-subtle {
  background: var(--card-subtle);
  border: 1px solid var(--bd);
  border-radius: 1rem;
  padding: 0.95rem;
}

/* Form input */
.in {
  width: 100%;
  border: 1px solid var(--bd);
  background: var(--input-bg);
  color: var(--tx);
  border-radius: 0.85rem;
  padding: 0.7rem 0.95rem;
  font-size: 0.875rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.in:focus {
  outline: none;
  border-color: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.20);
}
.in option {
  background-color: var(--card);
  color: var(--tx);
  padding: 8px;
}

/* Primary Button */
.b {
  background: linear-gradient(135deg, #059669 0%, #047857 100%);
  color: #ffffff;
  font-weight: 700;
  border-radius: 0.85rem;
  padding: 0.7rem 1.25rem;
  font-size: 0.875rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  cursor: pointer;
  border: 1px solid rgba(16, 185, 129, 0.3);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 2px 8px -2px rgba(5, 150, 105, 0.4);
}
.b:hover {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  transform: translateY(-1.5px);
  box-shadow: 0 6px 16px -2px rgba(16, 185, 129, 0.45);
}
.b:active {
  transform: translateY(0);
}

/* Secondary Button */
.b2 {
  background: var(--btn-sec-bg);
  color: var(--btn-sec-tx);
  border: 1px solid var(--bd);
  border-radius: 0.85rem;
  padding: 0.6rem 1rem;
  font-size: 0.825rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  transition: all 0.2s ease;
}
.b2:hover {
  background: var(--btn-sec-hover);
  border-color: var(--bd-hover);
  transform: translateY(-1px);
}

/* Label */
.l {
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--tx-muted);
  display: block;
  margin-bottom: 0.35rem;
}

/* Chips / Badges */
.chip {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.25rem 0.65rem;
  border-radius: 9999px;
  background: var(--chip-green-bg);
  color: var(--chip-green-tx);
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  border: 1px solid rgba(16, 185, 129, 0.2);
}
.chip.red {
  background: var(--chip-red-bg);
  color: var(--chip-red-tx);
  border-color: rgba(239, 68, 68, 0.25);
}
.chip.amb {
  background: var(--chip-amb-bg);
  color: var(--chip-amb-tx);
  border-color: rgba(245, 158, 11, 0.25);
}
.chip.blue {
  background: var(--chip-blue-bg);
  color: var(--chip-blue-tx);
  border-color: rgba(56, 189, 248, 0.25);
}
.chip.purple {
  background: var(--chip-purple-bg);
  color: var(--chip-purple-tx);
  border-color: rgba(168, 85, 247, 0.25);
}

/* Danger Card */
.c-danger {
  background: var(--danger-bg);
  border: 1px solid var(--danger-bd);
  color: var(--tx);
  border-radius: 1.25rem;
  padding: 1.25rem;
}

/* Live pulsing indicator */
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  background-color: #10b981;
  box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  animation: pulse-ring 2s infinite;
}
@keyframes pulse-ring {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

/* Delivery timeline pulse */
.pulse-radar {
  position: relative;
}
.pulse-radar::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 9999px;
  border: 2px solid #10b981;
  animation: radar-ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
}
@keyframes radar-ping {
  0% { transform: scale(0.8); opacity: 1; }
  100% { transform: scale(1.6); opacity: 0; }
}

/* Custom scrollbars */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--bd-hover); }

/* Larger delivery / tracking status */

.trk-icon{font-size:1.35rem;line-height:1}
.trk-label{font-size:.8rem;line-height:1.2;text-align:center}
.trk-step{padding:0 .1rem}
@media (max-width:480px){.trk-label{font-size:.68rem}.trk-icon{font-size:1.15rem}}

<script>
// --- AUDIO SYNTHESIS & FEEDBACK ---
let audioCtx = null;
let soundEnabled = true;

function playAudioFeedback(type = 'success') {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'celebrate') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      osc.frequency.setValueAtTime(783.99, now + 0.16);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.45);
    } else {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880.00, now + 0.06);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  } catch(e) {}
}

// --- OFFLINE CONFETTI (no external library) ---
function confetti(opts) {
  opts = opts || {};
  const n = opts.particleCount || 50, colors = opts.colors || ['#10b981'];
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  cv.width = innerWidth; cv.height = innerHeight;
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  const ox = cv.width / 2, oy = cv.height * ((opts.origin && opts.origin.y) || 0.7);
  const ps = Array.from({length: n}, () => {
    const a = (-90 + (Math.random() - 0.5) * (opts.spread || 60)) * Math.PI / 180, v = 8 + Math.random() * 8;
    return {x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: 4 + Math.random() * 4,
            c: colors[Math.floor(Math.random() * colors.length)], r: Math.random() * 6};
  });
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.vx *= 0.99; p.r += 0.2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, 1 - f / 90); ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s / 2); ctx.restore(); });
    if (++f < 90) requestAnimationFrame(tick); else cv.remove();
  })();
}

function launchConfetti() {
  playAudioFeedback('celebrate');
  if (typeof confetti === 'function') {
    confetti({
      particleCount: 50,
      spread: 60,
      origin: { y: 0.7 },
      colors: ['#10b981', '#059669', '#0284c7', '#d97706', '#8b5cf6']
    });
  }
}

// --- THEME MANAGEMENT ---
const THEME_KEY = 'ecocycle_theme_pref';
let currentTheme = localStorage.getItem(THEME_KEY) || 'dark';

function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
}
applyTheme(currentTheme);

function toggleTheme() {
  const next = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  playAudioFeedback('tap');
  render();
}

function themeToggleBtn(extraClass = '') {
  const isDark = currentTheme === 'dark';
  return '<button onclick="toggleTheme()" title="Toggle ' + (isDark ? 'Light' : 'Dark') + ' Mode" class="relative inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all shadow-sm cursor-pointer ' +
    (isDark 
      ? 'border-emerald-800/80 bg-emerald-950/70 text-emerald-300 hover:bg-emerald-900/60 hover:border-emerald-500' 
      : 'border-slate-300 bg-white/90 text-slate-700 hover:bg-slate-100') + 
    ' ' + extraClass + '">' +
    (isDark 
      ? '<span class="text-sm">☀️</span><span class="hidden sm:inline">Light</span>' 
      : '<span class="text-sm">🌙</span><span class="hidden sm:inline">Dark</span>') +

}

const $ = id => document.getElementById(id);

function toast(t, icon = '🌿') {
  playAudioFeedback('tap');
  const e = document.createElement('div');
  e.className = 'b shadow-2xl pointer-events-auto border border-emerald-400/40 backdrop-blur-md px-4 py-3 text-sm flex items-center gap-2 animate-bounce-subtle';
  e.innerHTML = '<span class="text-lg">' + icon + '</span><span>' + t + '</span>';
  $('toast').appendChild(e);
  setTimeout(() => {
    e.style.opacity = '0';
    e.style.transform = 'translateY(10px)';
    e.style.transition = 'all 0.3s ease';
    setTimeout(() => e.remove(), 300);
  }, 2700);
}

function stepper(list, st, clickAction = '') {
  return '<div class="flex gap-2 mt-3 cursor-pointer" onclick="' + clickAction + '">' + list.map((x, i) => {
    const isDone = i <= st;
    const isCurrent = i === st;
    return '<div class="flex-1 text-center group">' +
      '<div class="trk-bar rounded-full transition-all duration-300 ' + 
        (isDone 
          ? 'bg-gradient-to-r from-emerald-500 to-teal-500 shadow-sm shadow-emerald-500/50' 
          : 'bg-[var(--stepper-off)]') + 
      '"></div>' +
      '<div class="flex flex-col items-center justify-center gap-1 mt-2 trk-step">' +
        '<span class="trk-icon ' + (isCurrent ? 'pulse-radar' : '') + '">' + x.icon + '</span>' +
        '<span class="trk-label ' + (isCurrent ? 'font-extrabold text-emerald-500 dark:text-emerald-400' : isDone ? 'font-bold opacity-80' : 'text-[var(--tx-muted)]') + '">' + x.name + '</span>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

function updateSim() {
  const kg = +$('simKg').value;
  $('calcKgLabel').textContent = kg + ' kg / week';
  const rawType = $('simType').value.replace(/^[^\w]+/, '').trim();
  const grade = $('simGrade').value;
  const single = calc(rawType, kg, grade);
  const monthlyPay = single.pay * 4.3;
  const monthlyPts = single.pts * 4.3;
  const monthlyKwh = (kg * 4.3 * 1.05).toFixed(0);
  const monthlyCo2 = (kg * 4.3 * 1.8).toFixed(0);

  $('simPayout').textContent = m(monthlyPay);
  $('simPoints').textContent = Math.round(monthlyPts) + ' pts';
  $('simKwh').textContent = '~' + monthlyKwh + ' kWh';
  $('simCo2').textContent = '~' + monthlyCo2 + ' kg CO₂e';
}

  for (let i = 0; i < count; i++) {
    const angle1 = (i * 2 * Math.PI) / count - Math.PI / 2;
    const angle2 = ((i + 1) * 2 * Math.PI) / count - Math.PI / 2;
    const x1 = cx + rOuter * Math.cos(angle1);
    const y1 = cy + rOuter * Math.sin(angle1);
    const x2 = cx + rOuter * Math.cos(angle2);
    const y2 = cy + rOuter * Math.sin(angle2);
    const x3 = cx + rInner * Math.cos(angle2);
    const y3 = cy + rInner * Math.sin(angle2);
    const x4 = cx + rInner * Math.cos(angle1);
    const y4 = cy + rInner * Math.sin(angle1);

    paths += '<path d="M ' + x1 + ' ' + y1 + ' A ' + rOuter + ' ' + rOuter + ' 0 0 1 ' + x2 + ' ' + y2 + ' L ' + x3 + ' ' + y3 + ' A ' + rInner + ' ' + rInner + ' 0 0 0 ' + x4 + ' ' + y4 + ' Z" fill="' + colors[i] + '"/>';
  }

  return '<svg class="w-20 h-20 md:w-24 md:h-24 shrink-0 drop-shadow-md" viewBox="0 0 100 100">' +
    paths +
    '<circle cx="50" cy="50" r="22" fill="var(--card)" />' +
    '<text x="50" y="47" text-anchor="middle" font-size="8" font-weight="900" fill="var(--tx)">UN</text>' +
    '<text x="50" y="56" text-anchor="middle" font-size="7" font-weight="800" fill="var(--tx)">SDGs</text>' +
  '</svg>';
}

// --- RENDER ROUTER ---
function render() {
  const r = S.role, p = S.page;
  let b;

  if (p === 'login') {
    $('app').innerHTML = loginView();
    return;
  }

  if (p === 'landing' || (!r && (p === 'home' || !p))) {
    b = landingPage();
  } else if (p === 'about') {
    b = about();
  } else if (p === 'ngo') {
    b = ngo();
  } else if (r === 'customer') {
    b = p === 'rates' ? rates() : p === 'rewards' ? rewards() : custHome();
  } else if (r === 'agent') {
    b = p === 'earn' ? earn() : agentHome();
  } else if (r === 'b2b') {
    b = p === 'orders' ? orders() : b2bHome();
  } else if (r === 'owner') {
    b = ownerHome();
  } else {
    b = landingPage();
  }

  $('app').innerHTML = shell(b);
  if (r === 'b2b' && p === 'home') bEst();
  if (r === 'agent' && p === 'home' && $('ae2')) aEst();
}
